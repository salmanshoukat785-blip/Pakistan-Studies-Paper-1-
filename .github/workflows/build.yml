name: Build APK

# Runs when:
#  - anything is pushed or uploaded to main or master
#  - a tag v* is created
#  - "Run workflow" is pressed in the Actions tab
#
# If the top level of the repository contains .zip files (for example PMSNotes_v8.zip),
# the workflow builds the zip that was added or changed in the latest commit.
# Older zips can stay in the repository; they are ignored.
# If there is no zip, the repository itself is built.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find project (unzip if a zip is present)
        id: proj
        run: |
          set -e
          # Pick the zip that was added or changed in the most recent commit
          # (file timestamps are not reliable after a git checkout).
          ZIP=""
          BEST=-1
          while IFS= read -r z; do
            [ -n "$z" ] || continue
            T=$(git log -1 --format=%ct -- "$z" 2>/dev/null || true)
            T=${T:-0}
            if [ "$T" -ge "$BEST" ]; then BEST=$T; ZIP=$z; fi
          done < <(ls -1 ./*.zip 2>/dev/null | sort -V)
          if [ -n "$ZIP" ]; then
            echo "Zip found: $ZIP"
            rm -rf _unzipped && mkdir _unzipped
            unzip -q "$ZIP" -d _unzipped
            SETTINGS=$(find _unzipped -name settings.gradle.kts -not -path '*/node_modules/*' | head -n 1)
            if [ -z "$SETTINGS" ]; then
              echo "::error::settings.gradle.kts not found inside the zip. The zip must contain the whole Android project."
              exit 1
            fi
            DIR=$(dirname "$SETTINGS")
          else
            echo "No zip found, building the repository project"
            DIR=.
          fi
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p "${{ steps.proj.outputs.dir }}" assembleDebug --stacktrace

      - name: Rename APK
        run: cp "${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" PMS-PakStudies.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PMS-PakStudies-APK
          path: PMS-PakStudies.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PMS-PakStudies.apk
